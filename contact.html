<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Me - Nick Parke</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" type="text/css">
</head>
<body>
    <header>
        <img src="logo.png" alt="Nick Parke Logo">
        <span style="font-size:2rem; vertical-align: middle;">Nick Parke</span>
    </header>
    <nav class="main-nav">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="interests.html">Interests</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>
    <main>
        <article>
            <section>
                <h2>Contact Me</h2>
                <!-- Contact Form -->
                <form id="webForm" action="#">
                    <fieldset>
                        <legend>Get in Touch</legend>
                        
                        <!-- Name -->
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required><br><br>
                        
                        <!-- Email -->
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required><br><br>
                        
                        <!-- Reason for Contact (Select List) -->
                        <label for="reason">Reason for Contact:</label>
                        <select id="reason" name="reason" required>
                            <option value="">--Please choose an option--</option>
                            <option value="General Inquiry">General Inquiry</option>
                            <option value="Feedback">Feedback</option>
                            <option value="Collaboration">Collaboration</option>
                            <option value="Other">Other</option>
                        </select><br><br>
                        
                        <!-- Preferred Contact Method (Radio Buttons) -->
                        <span>Preferred Contact Method:</span><br>
                        <input type="radio" id="contactEmail" name="contactMethod" value="Email" checked>
                        <label for="contactEmail">Email</label>
                        <input type="radio" id="contactPhone" name="contactMethod" value="Phone">
                        <label for="contactPhone">Phone</label>
                        <input type="radio" id="contactText" name="contactMethod" value="Text">
                        <label for="contactText">Text</label>
                        <br><br>
                        
                        <!-- Subscribe to Newsletter (Checkbox) -->
                        <input type="checkbox" id="subscribe" name="subscribe" value="Yes">
                        <label for="subscribe">Subscribe to newsletter</label>
                        <br><br>
                        
                        <!-- Message (Textarea) -->
                        <label for="message">Message:</label><br>
                        <textarea id="message" name="message" rows="5" cols="40" required></textarea>
                        <br><br>
                        
                        <!-- Submit Button -->
                        <button type="submit">Submit</button>
                    </fieldset>
                </form>
                <!-- Output div for displaying user input -->
                <p><div id="output"></div></p>
            </section>
        </article>
    </main>
    <footer>
        <nav class="footer-nav">
            <a href="index.html">Home</a> |
            <a href="about.html">About</a> |
            <a href="interests.html">Interests</a> |
            <a href="gallery.html">Gallery</a> |
            <a href="contact.html">Contact</a>
        </nav>
        <p>&copy; 2025 Nick Parke. All rights reserved.</p>
    </footer>
    <!-- Link to provided JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
